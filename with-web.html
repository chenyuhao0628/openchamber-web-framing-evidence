<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑行 · Pelican on a Bicycle</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 26px;
    background:
      radial-gradient(1200px 760px at 50% -10%, #fffaf0 0%, #f5ead4 46%, #e9d9bc 100%);
    font-family: ui-rounded, "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  .stage {
    width: min(calc(100vw - 52px), 1040px);
    border-radius: 28px;
    overflow: hidden;
    background: #fff7e6;
    box-shadow:
      0 34px 70px -28px rgba(92, 62, 24, .42),
      0 12px 28px -18px rgba(92, 62, 24, .28),
      0 0 0 1px rgba(92, 62, 24, .07);
  }
  svg { display: block; width: 100%; height: auto; }

  @media (max-width: 700px) {
    body { padding: 12px; }
    .stage { width: calc(100vw - 24px); border-radius: 18px; }
  }

  .sun-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: sunBreathe 7s ease-in-out infinite alternate;
  }
  .cloud { animation: cloudFloat 10s ease-in-out infinite alternate; }
  .cloud.c2 { animation-duration: 14s; animation-delay: -4s; }
  .cloud.c3 { animation-duration: 18s; animation-delay: -8s; }
  .bird { animation: birdBob 4.8s ease-in-out infinite alternate; }
  .bird.b2 { animation-delay: -1.7s; }
  .bird.b3 { animation-delay: -3.1s; }

  .eyelid {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 5.6s infinite;
  }
  .scarf-tail {
    transform-box: view-box;
    transform-origin: 406px 201px;
    animation: flutter 1.1s ease-in-out infinite alternate;
  }
  .scarf-tail.b {
    transform-origin: 406px 205px;
    animation-duration: 1.35s;
    animation-delay: -.35s;
  }
  .puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: puffAway 1.7s ease-out infinite;
  }
  .puff.p2 { animation-delay: .62s; }
  .puff.p3 { animation-delay: 1.16s; }

  @keyframes sunBreathe {
    from { opacity: .62; transform: scale(.95); }
    to   { opacity: 1;   transform: scale(1.06); }
  }
  @keyframes cloudFloat {
    from { transform: translateX(-13px); }
    to   { transform: translateX(19px); }
  }
  @keyframes birdBob {
    from { transform: translateY(0); }
    to   { transform: translateY(-9px); }
  }
  @keyframes blink {
    0%, 89%, 94.5%, 100% { transform: scaleY(0); }
    91.5%, 93% { transform: scaleY(1); }
  }
  @keyframes flutter {
    from { transform: rotate(-4deg); }
    to   { transform: rotate(5deg); }
  }
  @keyframes puffAway {
    0%   { opacity: 0; transform: translate(0, 0) scale(.35); }
    18%  { opacity: .55; }
    100% { opacity: 0; transform: translate(-56px, -17px) scale(1.65); }
  }
</style>
</head>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const rig = $('rig');
  const wheelRear = $('wheelRearSpin');
  const wheelFront = $('wheelFrontSpin');
  const roadDashes = document.querySelector('g[fill="#F2DCA7"]');
  const chain = $('chain');
  const chainring = $('chainring');

  const near = {
    leg: $('legNear'),
    arm: $('armNear'),
    pedal: $('pedalNear'),
    foot: $('footNear')
  };
  const far = {
    leg: $('legFar'),
    arm: $('armFar'),
    pedal: $('pedalFar'),
    foot: $('footFar')
  };

  const BB = { x: 400, y: 398 };
  const CRANK = 30;
  const HIP = { x: 346, y: 296 };
  const THIGH = 76;
  const SHIN = 88;
  const FOOT_LIFT = 6;

  function solveLeg(theta) {
    const fx = BB.x + Math.cos(theta) * CRANK;
    const fy = BB.y + Math.sin(theta) * CRANK;
    const tx = fx;
    const ty = fy - FOOT_LIFT;
    const dx = tx - HIP.x;
    const dy = ty - HIP.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const along = (THIGH * THIGH - SHIN * SHIN + dist * dist) / (2 * dist);
    const bend = Math.sqrt(Math.max(0, THIGH * THIGH - along * along));
    const ux = dx / dist;
    const uy = dy / dist;
    const bx = HIP.x + ux * along;
    const by = HIP.y + uy * along;
    const k1 = { x: bx - uy * bend, y: by + ux * bend };
    const k2 = { x: bx + uy * bend, y: by - ux * bend };
    const knee = k1.x > k2.x ? k1 : k2;
    return { fx, fy, tx, ty, knee };
  }

  function drawLeg(side, theta) {
    const s = solveLeg(theta);
    side.leg.setAttribute(
      'd',
      'M' + HIP.x + ' ' + HIP.y +
      ' L' + s.knee.x.toFixed(1) + ' ' + s.knee.y.toFixed(1) +
      ' L' + s.tx.toFixed(1) + ' ' + s.ty.toFixed(1)
    );
    side.arm.setAttribute('x2', s.fx.toFixed(1));
    side.arm.setAttribute('y2', s.fy.toFixed(1));
    side.pedal.setAttribute('transform', 'translate(' + s.fx.toFixed(1) + ' ' + s.fy.toFixed(1) + ')');
    side.foot.setAttribute('transform', 'translate(' + s.tx.toFixed(1) + ' ' + s.ty.toFixed(1) + ')');
  }

  let last = performance.now();
  let crankAngle = 0.35;
  let wheelAngle = 0;
  let roadOffset = 0;
  let chainOffset = 0;
  let started = last;

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = (now - started) / 1000;

    crankAngle += dt * 4.4;
    wheelAngle += dt * 335;
    roadOffset = (roadOffset + dt * 228) % 180;
    chainOffset = (chainOffset + dt * 44) % 6.5;

    wheelRear.setAttribute('transform', 'rotate(' + wheelAngle.toFixed(1) + ' 255 400)');
    wheelFront.setAttribute('transform', 'rotate(' + wheelAngle.toFixed(1) + ' 545 400)');
    roadDashes.setAttribute('transform', 'translate(' + (-roadOffset).toFixed(1) + ' 0)');
    chain.setAttribute('stroke-dashoffset', chainOffset.toFixed(2));
    chainring.setAttribute('transform', 'rotate(' + (crankAngle * 180 / Math.PI).toFixed(1) + ' 400 398)');

    const bob = Math.sin(t * 6.4) * 1.3 + Math.sin(t * 2.15) * 0.6;
    rig.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');

    drawLeg(near, crankAngle);
    drawLeg(far, crankAngle + Math.PI);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
