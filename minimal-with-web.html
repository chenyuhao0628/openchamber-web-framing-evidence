<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2.4vh, 22px);
    padding: clamp(14px, 3vh, 32px);
    overflow-x: hidden;
    background:
      radial-gradient(900px 520px at 82% -6%, rgba(240, 178, 98, .13), transparent 62%),
      radial-gradient(1100px 650px at 46% 108%, rgba(53, 143, 132, .24), transparent 64%),
      #071b1b;
    color: #eaf2ee;
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .stage {
    width: min(1120px, 94vw, 132vh);
    max-width: 100%;
  }

  .frame {
    background: #bfe5f2;
    border-radius: clamp(16px, 2.2vw, 28px);
    overflow: hidden;
    box-shadow:
      0 34px 90px -30px rgba(0, 0, 0, .9),
      0 0 0 1px rgba(255, 255, 255, .09),
      inset 0 0 0 1px rgba(255, 255, 255, .16);
  }

  svg { display: block; width: 100%; height: auto; }

  .caption {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .65em;
    margin: 0;
    font-size: clamp(.66rem, 1.35vw, .82rem);
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #9cc2bb;
  }

  .caption .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #e7a24b;
    box-shadow: 0 0 12px rgba(231, 162, 75, .95);
    flex: none;
  }

  .caption .sep { color: #4f7b74; letter-spacing: 0; }

  .caption .zh {
    font-style: normal;
    letter-spacing: .1em;
    text-transform: none;
    color: #6f9a93;
  }

  #eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 6.4s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 92%, 97.5%, 100% { transform: scaleY(1); }
    94.5% { transform: scaleY(.08); }
  }

  .puff {
    transform-box: fill-box;
    transform-origin: center;
    animation: puff 1.8s ease-out infinite;
  }
  .puff:nth-of-type(2) { animation-delay: .65s; }
  .puff:nth-of-type(3) { animation-delay: 1.2s; }

  @keyframes puff {
    0%   { opacity: 0; transform: translate(0, 0) scale(.35); }
    18%  { opacity: .5; }
    100% { opacity: 0; transform: translate(-72px, -22px) scale(1.55); }
  }

  .wave { animation: waveShift 24s linear infinite; }

  @keyframes waveShift {
    to { stroke-dashoffset: -260; }
  }

  #sunGlow {
    transform-box: fill-box;
    transform-origin: center;
    animation: glow 6.5s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { opacity: .45; transform: scale(.98); }
    50%      { opacity: .8;  transform: scale(1.07); }
  }

  @media (prefers-reduced-motion: reduce) {
    #eye, .puff, .wave, #sunGlow { animation: none; }
    .puff { opacity: 0; }
  }
</style>
</head>
<body>

<script>
(() => {
  const svg = document.querySelector('svg');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const $ = (id) => document.getElementById(id);

  const rearSpin = $('rearSpin');
  const frontSpin = $('frontSpin');
  const chainring = $('chainring');
  const rider = $('rider');
  const groundDashes = Array.from(document.querySelectorAll('.ground-dash'));

  const BB = { x: 455, y: 400 };
  const CRANK_R = 44;
  const HIP = { x: 405, y: 294 };
  const THIGH = 84;
  const SHIN = 80;
  const CRANK_MS = 2400;
  const GEAR = 1.2;
  const TAU = Math.PI * 2;

  const legs = {
    near: {
      thigh: $('nearThigh'), shin: $('nearShin'), knee: $('nearKnee'),
      foot: $('nearFoot'), pedal: $('nearPedal'), arm: $('nearArm')
    },
    far: {
      thigh: $('farThigh'), shin: $('farShin'), knee: $('farKnee'),
      foot: $('farFoot'), pedal: $('farPedal'), arm: $('farArm')
    }
  };

  function setLine(el, a, b) {
    el.setAttribute('x1', a.x.toFixed(2));
    el.setAttribute('y1', a.y.toFixed(2));
    el.setAttribute('x2', b.x.toFixed(2));
    el.setAttribute('y2', b.y.toFixed(2));
  }

  function legPose(angle, bob) {
    const pedal = {
      x: BB.x + CRANK_R * Math.cos(angle),
      y: BB.y + CRANK_R * Math.sin(angle)
    };
    const ankle = { x: pedal.x, y: pedal.y - 6 };
    const hip = { x: HIP.x, y: HIP.y + bob };

    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    const d = Math.hypot(dx, dy);
    const base = Math.atan2(dy, dx);
    const cosA = (THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d);
    const offset = Math.acos(Math.max(-1, Math.min(1, cosA)));
    const kneeAngle = base - offset;

    const knee = {
      x: hip.x + THIGH * Math.cos(kneeAngle),
      y: hip.y + THIGH * Math.sin(kneeAngle)
    };

    return { hip, knee, ankle, pedal };
  }

  function drawLeg(parts, pose) {
    setLine(parts.thigh, pose.hip, pose.knee);
    setLine(parts.shin, pose.knee, pose.ankle);
    parts.knee.setAttribute('cx', pose.knee.x.toFixed(2));
    parts.knee.setAttribute('cy', pose.knee.y.toFixed(2));
    parts.foot.setAttribute('transform',
      `translate(${pose.pedal.x.toFixed(2)} ${(pose.pedal.y - 5).toFixed(2)})`);
    parts.pedal.setAttribute('transform',
      `translate(${pose.pedal.x.toFixed(2)} ${pose.pedal.y.toFixed(2)})`);
    setLine(parts.arm, BB, pose.pedal);
  }

  function render(ms) {
    const theta = 0.35 + (ms / CRANK_MS) * TAU;
    const bob = Math.sin(theta * 2) * 2;

    rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);

    drawLeg(legs.near, legPose(theta, bob));
    drawLeg(legs.far, legPose(theta + Math.PI, bob));

    const wheelDeg = ((theta * GEAR * 180) / Math.PI) % 360;
    rearSpin.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
    frontSpin.setAttribute('transform', `rotate(${wheelDeg.toFixed(2)})`);
    chainring.setAttribute('transform',
      `rotate(${(((theta * 180) / Math.PI) % 360).toFixed(2)} ${BB.x} ${BB.y})`);

    const distance = theta * GEAR * 80;
    for (const el of groundDashes) {
      const period = parseFloat(el.dataset.period || '200');
      const speed = parseFloat(el.dataset.speed || '1');
      el.setAttribute('stroke-dashoffset', ((distance * speed) % period).toFixed(2));
    }
  }

  if (reduceMotion.matches) {
    render(0);
    svg.pauseAnimations();
    return;
  }

  const start = performance.now();
  function tick(now) {
    render(Math.max(0, now - start));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
