<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#183e47" />
  <title>Pelican on a Bicycle</title>
  <style>
    :root {
      --ink: #173b44;
      --ink-soft: #315c62;
      --cream: #fff5df;
      --coral: #ee7455;
      --teal: #2d7f80;
      --glass: rgba(255, 248, 230, 0.78);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(8px, 2vw, 28px);
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 209, 132, 0.22), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(75, 152, 155, 0.25), transparent 34%),
        #12343e;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    }

    .scene-shell {
      position: relative;
      width: min(96vw, calc(91svh * 5 / 3), 1400px);
      aspect-ratio: 5 / 3;
      overflow: hidden;
      isolation: isolate;
      border-radius: clamp(18px, 2.4vw, 36px);
      background: #b9dfe2;
      box-shadow:
        0 35px 100px rgba(2, 20, 26, 0.38),
        0 10px 30px rgba(2, 20, 26, 0.2),
        inset 0 0 0 1px rgba(255, 255, 255, 0.22);
    }

    .illustration { display: block; width: 100%; height: 100%; }

    .title-card {
      position: absolute;
      top: clamp(22px, 4.5vw, 62px);
      left: clamp(22px, 4.8vw, 68px);
      pointer-events: none;
      max-width: 39%;
      filter: drop-shadow(0 3px 0 rgba(255, 248, 225, 0.24));
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 14px;
      font-size: clamp(8px, 0.82vw, 12px);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      border-radius: 99px;
      background: var(--coral);
    }

    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif;
      font-size: clamp(40px, 6vw, 88px);
      font-weight: 700;
      line-height: 0.82;
      letter-spacing: -0.055em;
      color: var(--ink);
    }

    h1 em {
      display: block;
      padding-left: 0.44em;
      color: var(--coral);
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: clamp(14px, 1.6vw, 22px) 0 0;
      font-size: clamp(10px, 1vw, 14px);
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(23, 59, 68, 0.72);
    }

    .weather {
      position: absolute;
      top: clamp(20px, 3.3vw, 44px);
      right: clamp(20px, 3.6vw, 52px);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(23, 59, 68, 0.12);
      background: rgba(255, 248, 230, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--ink-soft);
      font-size: clamp(8px, 0.86vw, 12px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .weather-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--coral);
      box-shadow: 0 0 0 4px rgba(238, 116, 85, 0.16);
    }

    .motion-toggle {
      position: absolute;
      right: clamp(18px, 3vw, 42px);
      bottom: clamp(16px, 2.6vw, 36px);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      border: 1px solid rgba(23, 59, 68, 0.15);
      border-radius: 999px;
      background: var(--glass);
      color: var(--ink);
      box-shadow: 0 8px 24px rgba(43, 65, 58, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font: inherit;
      font-size: clamp(9px, 0.9vw, 12px);
      font-weight: 800;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .motion-toggle:hover {
      transform: translateY(-2px);
      background: rgba(255, 249, 235, 0.94);
      box-shadow: 0 11px 28px rgba(43, 65, 58, 0.17);
    }

    .motion-toggle:focus-visible {
      outline: 3px solid rgba(238, 116, 85, 0.52);
      outline-offset: 3px;
    }

    .toggle-icon {
      width: 15px;
      text-align: center;
      color: var(--coral);
      font-size: 11px;
      line-height: 1;
    }

    .route-note {
      position: absolute;
      left: clamp(22px, 4.8vw, 68px);
      bottom: clamp(18px, 2.8vw, 38px);
      margin: 0;
      color: rgba(23, 59, 68, 0.58);
      font-size: clamp(8px, 0.78vw, 11px);
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .route-note span { color: var(--coral); padding: 0 5px; }

    .cloud {
      transform-box: fill-box;
      transform-origin: center;
      animation: cloud-drift 14s ease-in-out infinite alternate;
    }

    .cloud-b { animation-duration: 19s; animation-delay: -7s; }
    .cloud-c { animation-duration: 23s; animation-delay: -11s; }

    .sea-line {
      stroke-dasharray: 48 78;
      animation: sea-drift 8s linear infinite;
    }

    .sea-line-b {
      stroke-dasharray: 24 90;
      animation-duration: 11s;
      animation-direction: reverse;
    }

    .speed-stroke { animation: speed-pulse 1.25s ease-in-out infinite; }
    .speed-stroke-b { animation-delay: -0.55s; }

    .road-dash {
      stroke-dasharray: 58 74;
      animation: road-drift 0.9s linear infinite;
    }

    .eye-group {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.4s ease-in-out infinite;
    }

    .scarf-tail-a,
    .scarf-tail-b {
      transform-box: fill-box;
      transform-origin: 100% 45%;
      animation: scarf-flutter 0.7s ease-in-out infinite alternate;
    }

    .scarf-tail-b {
      animation-duration: 0.9s;
      animation-delay: -0.35s;
    }

    .small-fish {
      transform-box: fill-box;
      transform-origin: center;
      animation: fish-wiggle 1.8s ease-in-out infinite;
    }

    .is-paused .cloud,
    .is-paused .sea-line,
    .is-paused .speed-stroke,
    .is-paused .road-dash,
    .is-paused .eye-group,
    .is-paused .scarf-tail-a,
    .is-paused .scarf-tail-b,
    .is-paused .small-fish {
      animation-play-state: paused;
    }

    @keyframes cloud-drift {
      from { transform: translateX(-12px); }
      to { transform: translateX(24px); }
    }

    @keyframes sea-drift { to { stroke-dashoffset: -252; } }

    @keyframes speed-pulse {
      0%, 100% { opacity: 0.18; transform: translateX(5px); }
      50% { opacity: 0.68; transform: translateX(-8px); }
    }

    @keyframes road-drift { to { stroke-dashoffset: -132; } }

    @keyframes blink {
      0%, 45%, 49%, 100% { transform: scaleY(1); }
      47% { transform: scaleY(0.08); }
    }

    @keyframes scarf-flutter {
      from { transform: rotate(-4deg) skewY(-2deg); }
      to { transform: rotate(4deg) skewY(2deg); }
    }

    @keyframes fish-wiggle {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(3deg); }
    }

    @media (max-width: 720px) {
      .scene-shell {
        width: min(96vw, calc(94svh * 5 / 3));
        border-radius: 20px;
      }
      .title-card { max-width: 48%; }
      .eyebrow { margin-bottom: 8px; }
      .subtitle { line-height: 1.5; }
      .weather { padding: 7px 10px; }
      .route-note { display: none; }
      .motion-toggle { padding: 8px 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud,
      .sea-line,
      .speed-stroke,
      .road-dash,
      .eye-group,
      .scarf-tail-a,
      .scarf-tail-b,
      .small-fish {
        animation: none;
      }
    }
  </style>
</head>

    <div class="title-card">
      <p class="eyebrow">Seaside Cycle Club &middot; No. 03</p>

      <p class="subtitle">A little seaside joy ride.</p>

      Coastline &middot; 24&deg;C

    <button class="motion-toggle" id="motionToggle" type="button" aria-label="Pause animation">
      <span class="toggle-icon" aria-hidden="true">II</span>
      <span id="motionLabel">Pause</span>
    </button>
  </main>

  <script>
    (() => {
      const shell = document.getElementById("sceneShell");
      const toggle = document.getElementById("motionToggle");
      const toggleIcon = toggle.querySelector(".toggle-icon");
      const toggleLabel = document.getElementById("motionLabel");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const rearSpinner = document.querySelector(".rear-spinner");
      const frontSpinner = document.querySelector(".front-spinner");
      const crank = document.getElementById("crank");
      const pedalNear = document.getElementById("pedal-near");
      const pedalFar = document.getElementById("pedal-far");
      const rider = document.getElementById("rider");

      const legs = [
        {
          phase: 0,
          hip: { x: 577, y: 376 },
          upperLength: 110,
          lowerLength: 124,
          thighOutline: document.getElementById("near-thigh-outline"),
          shinOutline: document.getElementById("near-shin-outline"),
          thigh: document.getElementById("near-thigh"),
          shin: document.getElementById("near-shin"),
          kneeOutline: document.getElementById("near-knee-outline"),
          knee: document.getElementById("near-knee"),
          foot: document.getElementById("near-foot")
        },
        {
          phase: Math.PI,
          hip: { x: 552, y: 386 },
          upperLength: 110,
          lowerLength: 124,
          thighOutline: document.getElementById("far-thigh-outline"),
          shinOutline: document.getElementById("far-shin-outline"),
          thigh: document.getElementById("far-thigh"),
          shin: document.getElementById("far-shin"),
          kneeOutline: document.getElementById("far-knee-outline"),
          knee: document.getElementById("far-knee"),
          foot: document.getElementById("far-foot")
        }
      ];

      const crankCenter = { x: 630, y: 560 };
      const pedalRadius = 37;
      const degreesToRadians = Math.PI / 180;
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      function footPath(x, y) {
        return "M" + (x - 8) + " " + (y - 1) +
          "L" + (x + 21) + " " + (y - 4) +
          "L" + (x + 13) + " " + (y + 4) +
          "L" + (x + 19) + " " + (y + 8) +
          "L" + (x + 5) + " " + (y + 6) +
          "L" + (x - 9) + " " + (y + 8) + "Z";
      }

      function updateLeg(leg, crankRadians, bob) {
        const pedal = {
          x: crankCenter.x + Math.sin(crankRadians + leg.phase) * pedalRadius,
          y: crankCenter.y - Math.cos(crankRadians + leg.phase) * pedalRadius
        };
        const hip = { x: leg.hip.x, y: leg.hip.y + bob };
        const dx = pedal.x - hip.x;
        const dy = pedal.y - hip.y;
        const actualDistance = Math.hypot(dx, dy);
        const distance = clamp(actualDistance, 24, leg.upperLength + leg.lowerLength - 0.5);
        const angle = Math.atan2(dy, dx);
        const cosine = clamp(
          (leg.upperLength * leg.upperLength + distance * distance - leg.lowerLength * leg.lowerLength) /
          (2 * leg.upperLength * distance), -1, 1
        );
        const kneeAngle = angle - Math.acos(cosine);
        const knee = {
          x: hip.x + Math.cos(kneeAngle) * leg.upperLength,
          y: hip.y + Math.sin(kneeAngle) * leg.upperLength
        };
        const thigh = "M" + hip.x + " " + hip.y + "L" + knee.x + " " + knee.y;
        const shin = "M" + knee.x + " " + knee.y + "L" + pedal.x + " " + pedal.y;

        leg.thighOutline.setAttribute("d", thigh);
        leg.thigh.setAttribute("d", thigh);
        leg.shinOutline.setAttribute("d", shin);
        leg.shin.setAttribute("d", shin);
        leg.kneeOutline.setAttribute("cx", knee.x);
        leg.kneeOutline.setAttribute("cy", knee.y);
        leg.knee.setAttribute("cx", knee.x);
        leg.knee.setAttribute("cy", knee.y);
        leg.foot.setAttribute("d", footPath(pedal.x, pedal.y - 2));
      }

      function render(time) {
        const wheelAngle = (time * 520) % 360;
        const crankRadians = time * 250 * degreesToRadians;
        const crankDegrees = (time * 250) % 360;
        const bob = Math.sin(crankRadians * 2) * 2.2;

        rearSpinner.setAttribute("transform", "rotate(" + wheelAngle + ")");
        frontSpinner.setAttribute("transform", "rotate(" + wheelAngle + ")");
        crank.setAttribute("transform", "rotate(" + crankDegrees + ")");
        pedalNear.setAttribute("transform", "translate(0 -" + pedalRadius + ") rotate(" + (-crankDegrees) + ")");
        pedalFar.setAttribute("transform", "translate(0 " + pedalRadius + ") rotate(" + (-crankDegrees) + ")");
        rider.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
        legs.forEach((leg) => updateLeg(leg, crankRadians, bob));
      }

      let paused = reducedMotion;
      let elapsed = 0;
      let lastTimestamp = null;

      function updateButton() {
        shell.classList.toggle("is-paused", paused);
        toggleIcon.textContent = paused ? ">" : "II";
        toggleLabel.textContent = paused ? "Play" : "Pause";
        toggle.setAttribute("aria-label", paused ? "Play animation" : "Pause animation");
        toggle.setAttribute("aria-pressed", String(paused));
      }

      function animate(timestamp) {
        if (lastTimestamp === null) lastTimestamp = timestamp;
        const delta = Math.min((timestamp - lastTimestamp) / 1000, 0.05);
        lastTimestamp = timestamp;
        if (!paused) elapsed += delta;
        render(elapsed);
        requestAnimationFrame(animate);
      }

      toggle.addEventListener("click", () => {
        paused = !paused;
        updateButton();
      });

      render(0);
      updateButton();
      requestAnimationFrame(animate);
    })();
  </script>
