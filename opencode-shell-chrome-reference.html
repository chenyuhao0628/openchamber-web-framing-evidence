  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2.5vw, 32px);
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 255, 255, 0.72), transparent 30%),
        radial-gradient(circle at 82% 92%, rgba(188, 149, 97, 0.28), transparent 36%),
        #eadfc9;
      color: #263d3a;
      font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: min(1240px, 100%, calc((100svh - 64px) * 5 / 3));
      aspect-ratio: 5 / 3;
      overflow: hidden;
      border-radius: clamp(20px, 2.4vw, 32px);
      background: #9fcfd2;
      box-shadow:
        0 32px 80px rgba(65, 47, 25, 0.27),
        0 4px 14px rgba(65, 47, 25, 0.12),
        inset 0 0 0 1px rgba(255, 255, 255, 0.42);
      animation: arrive 900ms cubic-bezier(0.22, 0.9, 0.25, 1) both;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 0 80px rgba(36, 49, 39, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.36);
    }

    .stage svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .pause {
      position: absolute;
      right: clamp(13px, 2.2vw, 26px);
      bottom: clamp(13px, 2.2vw, 26px);
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 0.55em;
      padding: 0.65em 0.95em;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      background: rgba(25, 50, 47, 0.42);
      color: #fff8e8;
      font: inherit;
      font-size: clamp(11px, 1.2vw, 14px);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(24, 41, 36, 0.16);
      transition: background 180ms ease, transform 180ms ease;
    }

    .pause:hover {
      background: rgba(25, 50, 47, 0.62);
      transform: translateY(-1px);
    }

    .pause:active {
      transform: translateY(0);
    }

    .pause:focus-visible {
      outline: 3px solid rgba(255, 246, 222, 0.95);
      outline-offset: 3px;
    }

    .pause svg {
      width: 1.15em;
      height: 1.15em;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pause .play-icon {
      display: none;
      fill: currentColor;
      stroke: none;
    }

    .pause.is-paused .pause-icon {
      display: none;
    }

    .pause.is-paused .play-icon {
      display: block;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .stage {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage {
        animation: none;
      }
    }
  </style>
</head>

    <button class="pause" id="pause-button" type="button" aria-label="暂停动画">
      <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5v14M16 5v14"/>
      </svg>
      <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5l11 7-11 7z"/>
      </svg>
      <span id="pause-label">暂停</span>
    </button>
  </main>

  <script>
    (() => {
      const elements = {
        rider: document.getElementById("rider"),
        wing: document.getElementById("wing"),
        scarfA: document.getElementById("scarf-tail-a"),
        scarfB: document.getElementById("scarf-tail-b"),
        eye: document.getElementById("eye"),
        rearSpin: document.getElementById("rear-spin"),
        frontSpin: document.getElementById("front-spin"),
        crank: document.getElementById("crankset"),
        chain: document.getElementById("chain-dashes"),
        laneDashes: document.getElementById("lane-dashes"),
        farTufts: document.getElementById("far-tufts"),
        pebbles: document.getElementById("foreground-pebbles"),
        nearLegOutline: document.getElementById("near-leg-outline"),
        nearLegInner: document.getElementById("near-leg-inner"),
        nearKnee: document.getElementById("near-knee"),
        nearFoot: document.getElementById("near-foot"),
        nearPedal: document.getElementById("near-pedal"),
        farLegOutline: document.getElementById("far-leg-outline"),
        farLegInner: document.getElementById("far-leg-inner"),
        farKnee: document.getElementById("far-knee"),
        farFoot: document.getElementById("far-foot"),
        farPedal: document.getElementById("far-pedal"),
        button: document.getElementById("pause-button"),
        buttonLabel: document.getElementById("pause-label")
      };

      const clouds = Array.from(document.querySelectorAll(".cloud")).map((element) => ({
        element,
        x: Number(element.dataset.x),
        y: Number(element.dataset.y),
        speed: Number(element.dataset.speed),
        scale: Number(element.dataset.scale)
      }));

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const state = {
        playing: !reduceMotion,
        angle: -0.55,
        distance: 0,
        elapsed: 0,
        lastTime: performance.now()
      };

      const bottomBracket = { x: 610, y: 520 };
      const pedalRadius = 38;
      const nearHip = { x: 585, y: 401 };
      const farHip = { x: 611, y: 397 };
      const nearLegLengths = [92, 103];
      const farLegLengths = [88, 99];

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const mod = (value, divisor) => ((value % divisor) + divisor) % divisor;

      const solveLeg = (hip, foot, lengths) => {
        const [upper, lower] = lengths;
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy) || 0.001;
        const limited = clamp(distance, Math.abs(upper - lower) + 0.1, upper + lower - 0.1);
        const along = (upper * upper - lower * lower + limited * limited) / (2 * limited);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const ux = dx / distance;
        const uy = dy / distance;
        const baseX = hip.x + ux * along;
        const baseY = hip.y + uy * along;
        return {
          x: baseX + uy * height,
          y: baseY - ux * height
        };
      };

      const setPedalPose = (pedal, foot, x, y) => {
        const transform = `translate(${x.toFixed(2)} ${y.toFixed(2)})`;
        pedal.setAttribute("transform", transform);
        foot.setAttribute("transform", transform);
      };

      const setLeg = (outline, inner, knee, hip, foot, lengths) => {
        const joint = solveLeg(hip, foot, lengths);
        const path = `M ${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L ${joint.x.toFixed(2)} ${joint.y.toFixed(2)} L ${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`;
        outline.setAttribute("d", path);
        inner.setAttribute("d", path);
        knee.setAttribute("cx", joint.x.toFixed(2));
        knee.setAttribute("cy", joint.y.toFixed(2));
      };

      const setButtonState = () => {
        elements.button.classList.toggle("is-paused", !state.playing);
        elements.buttonLabel.textContent = state.playing ? "暂停" : "继续";
        elements.button.setAttribute("aria-label", state.playing ? "暂停动画" : "播放动画");
      };

      const render = () => {
        const bob = Math.sin(state.angle * 2) * 2.4;
        const nearX = bottomBracket.x + Math.cos(state.angle) * pedalRadius;
        const nearY = bottomBracket.y + Math.sin(state.angle) * pedalRadius;
        const farX = bottomBracket.x - Math.cos(state.angle) * pedalRadius;
        const farY = bottomBracket.y - Math.sin(state.angle) * pedalRadius;
        const nearAnkle = { x: nearX, y: nearY - 4 };
        const farAnkle = { x: farX, y: farY - 4 };

        elements.rider.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
        elements.wing.setAttribute("transform", `rotate(${(Math.sin(state.angle * 2) * 1.25).toFixed(2)} 595 264)`);
        elements.scarfA.setAttribute("transform", `rotate(${(Math.sin(state.angle * 2 + 0.55) * 4.2).toFixed(2)} 652 263)`);
        elements.scarfB.setAttribute("transform", `rotate(${(Math.sin(state.angle * 2 - 0.35) * 5.2).toFixed(2)} 650 267)`);

        const wheelDegrees = (state.angle * 180 / Math.PI * 2.25) % 360;
        elements.rearSpin.setAttribute("transform", `rotate(${wheelDegrees.toFixed(2)})`);
        elements.frontSpin.setAttribute("transform", `rotate(${wheelDegrees.toFixed(2)})`);
        elements.crank.setAttribute("transform", `rotate(${((state.angle * 180 / Math.PI) % 360).toFixed(2)})`);
        elements.chain.setAttribute("stroke-dashoffset", (-state.angle * 22).toFixed(2));

        elements.laneDashes.setAttribute("transform", `translate(${(-mod(state.distance, 200)).toFixed(2)} 0)`);
        elements.farTufts.setAttribute("transform", `translate(${(-mod(state.distance * 0.62, 206)).toFixed(2)} 0)`);
        elements.pebbles.setAttribute("transform", `translate(${(-mod(state.distance * 1.35, 314)).toFixed(2)} 0)`);

        clouds.forEach((cloud) => {
          const x = -220 + mod(cloud.x - state.distance * cloud.speed, 1640);
          cloud.element.setAttribute("transform", `translate(${x.toFixed(2)} ${cloud.y}) scale(${cloud.scale})`);
        });

        setPedalPose(elements.nearPedal, elements.nearFoot, nearX, nearY);
        setPedalPose(elements.farPedal, elements.farFoot, farX, farY);
        setLeg(elements.nearLegOutline, elements.nearLegInner, elements.nearKnee, { x: nearHip.x, y: nearHip.y + bob }, nearAnkle, nearLegLengths);
        setLeg(elements.farLegOutline, elements.farLegInner, elements.farKnee, { x: farHip.x, y: farHip.y + bob }, farAnkle, farLegLengths);

        const blinkCycle = state.elapsed % 5.4;
        const blinkAmount = blinkCycle > 5.18 ? Math.sin((blinkCycle - 5.18) / 0.22 * Math.PI) : 0;
        const lidScale = 1 - clamp(blinkAmount * 1.15, 0, 1);
        elements.eye.setAttribute("transform", `translate(725 205) scale(1 ${lidScale.toFixed(3)})`);
      };

      const loop = (time) => {
        const delta = Math.min((time - state.lastTime) / 1000, 0.05);
        state.lastTime = time;

        if (state.playing) {
          state.angle += delta * 2.05;
          state.distance += delta * 170;
          state.elapsed += delta;
          render();
        }

        requestAnimationFrame(loop);
      };

      elements.button.addEventListener("click", () => {
        state.playing = !state.playing;
        state.lastTime = performance.now();
        setButtonState();
        if (state.playing) render();
      });

      document.addEventListener("visibilitychange", () => {
        state.lastTime = performance.now();
      });

      setButtonState();
      render();
      requestAnimationFrame(loop);
    })();
  </script>
