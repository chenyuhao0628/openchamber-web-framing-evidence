<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14393a">
  <title>海岸慢骑 · Pelican on a Bicycle</title>
  <style>
    :root {
      --ink: #193d3e;
      --ink-soft: #315453;
      --paper: #f7edda;
      --coral: #dd6751;
      --gold: #e7b65c;
      --serif: "Bodoni 72", Didot, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      --sans: "Avenir Next", Avenir, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --song: "Songti SC", "Noto Serif CJK SC", "STSong", "Iowan Old Style", serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 2svh 2vw;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(circle at 15% 8%, rgba(77, 137, 132, .32), transparent 34%),
        radial-gradient(circle at 92% 92%, rgba(207, 151, 85, .12), transparent 38%),
        #123435;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .26;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    .poster {
      position: relative;
      width: min(1440px, 96vw, calc(96svh * 1.5384615));
      aspect-ratio: 1200 / 780;
      overflow: hidden;
      isolation: isolate;
      border-radius: clamp(14px, 2vw, 30px);
      background: #eadbc0;
      box-shadow:
        0 42px 100px rgba(0, 0, 0, .38),
        0 8px 24px rgba(0, 0, 0, .18),
        inset 0 0 0 1px rgba(255, 251, 238, .42);
      container-type: inline-size;
    }

    .art {
      display: block;
      width: 100%;
      height: 100%;
    }

    .poster::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 0 60px rgba(104, 65, 38, .09),
        inset 0 0 0 1px rgba(255, 250, 235, .34);
    }

    .copy {
      position: absolute;
      z-index: 3;
      top: clamp(18px, 4.8cqw, 62px);
      left: clamp(20px, 4.8cqw, 62px);
      width: 36cqw;
      pointer-events: none;
      animation: copyRise .9s cubic-bezier(.2, .8, .2, 1) both;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: .8em;
      margin: 0 0 clamp(12px, 1.7cqw, 22px);
      color: var(--ink-soft);
      font-size: clamp(7px, .78cqw, 10px);
      font-weight: 600;
      letter-spacing: .18em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      display: block;
      width: clamp(18px, 2.4cqw, 30px);
      height: 1px;
      flex: none;
      background: currentColor;
      opacity: .55;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(28px, 6.55cqw, 84px);
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: .88;
      text-wrap: balance;
    }

    h1 em {
      color: var(--coral);
      font-weight: 400;
    }

    .copy-zh {
      margin: clamp(11px, 1.7cqw, 22px) 0 0;
      color: rgba(25, 61, 62, .72);
      font-family: var(--song);
      font-size: clamp(8px, 1.04cqw, 13px);
      letter-spacing: .08em;
      line-height: 1.8;
    }

    .motion-toggle {
      position: absolute;
      z-index: 4;
      top: clamp(14px, 2.7cqw, 34px);
      right: clamp(14px, 2.7cqw, 34px);
      display: flex;
      align-items: center;
      gap: .72em;
      min-width: 40px;
      min-height: 40px;
      padding: 5px clamp(10px, 1.1cqw, 14px) 5px 5px;
      border: 1px solid rgba(25, 61, 62, .15);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(250, 244, 227, .64);
      box-shadow: 0 4px 14px rgba(44, 63, 55, .08);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      font-family: var(--sans);
      font-size: clamp(7px, .7cqw, 9px);
      font-weight: 600;
      letter-spacing: .16em;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }

    .motion-toggle:hover { background: rgba(255, 250, 237, .9); transform: translateY(-1px); }
    .motion-toggle:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }

    .toggle-icon {
      width: clamp(27px, 2.5cqw, 32px);
      height: clamp(27px, 2.5cqw, 32px);
      display: grid;
      place-items: center;
      flex: none;
      border-radius: 50%;
      color: var(--paper);
      background: var(--ink);
    }

    .toggle-icon svg { width: 12px; height: 12px; display: block; }
    .play-glyph { display: none; }
    .is-paused .pause-glyph { display: none; }
    .is-paused .play-glyph { display: block; }
    .is-paused .toggle-copy { opacity: .65; }

    .meta {
      position: absolute;
      z-index: 3;
      bottom: clamp(13px, 2.2cqw, 28px);
      display: flex;
      align-items: center;
      gap: .65em;
      color: rgba(34, 61, 55, .65);
      font-size: clamp(6px, .67cqw, 9px);
      font-weight: 600;
      letter-spacing: .15em;
      line-height: 1;
      text-transform: uppercase;
      pointer-events: none;
    }

    .meta-left { left: clamp(20px, 4.8cqw, 62px); }
    .meta-right { right: clamp(20px, 4.8cqw, 62px); }

    .meta-dot {
      width: clamp(4px, .4cqw, 5px);
      height: clamp(4px, .4cqw, 5px);
      flex: none;
      border-radius: 50%;
      background: var(--coral);
    }

    .meta-rule {
      width: clamp(15px, 2cqw, 26px);
      height: 1px;
      background: currentColor;
      opacity: .45;
    }

    .compass {
      width: clamp(12px, 1.15cqw, 15px);
      height: clamp(12px, 1.15cqw, 15px);
      flex: none;
      border: 1px solid currentColor;
      border-radius: 50%;
      position: relative;
      opacity: .8;
    }

    .compass::after {
      content: "";
      position: absolute;
      left: 52%;
      top: 20%;
      width: 1px;
      height: 42%;
      background: currentColor;
      transform: rotate(34deg);
      transform-origin: 50% 100%;
    }

    .cloud-a { animation: cloudDriftA 19s ease-in-out infinite; }
    .cloud-b { animation: cloudDriftB 26s ease-in-out infinite; }
    .cloud-c { animation: cloudDriftA 31s ease-in-out -8s infinite; }
    .sun-rays { transform-box: fill-box; transform-origin: center; animation: sunSpin 100s linear infinite; }
    .sun-glow { animation: sunBreathe 7s ease-in-out infinite; }
    .gull-a { animation: gullFloat 8s ease-in-out infinite; }
    .gull-b { animation: gullFloat 10s ease-in-out -3s infinite; }
    .gull-wing { transform-box: fill-box; transform-origin: center bottom; animation: gullWing 1.25s ease-in-out infinite alternate; }
    .gull-b .gull-wing { animation-duration: 1.6s; animation-delay: -.5s; }

    .sea-line { stroke-dasharray: 25 44; animation: seaDrift 9s linear infinite; }
    .sea-line-b { animation-duration: 12s; animation-direction: reverse; }
    .sea-line-c { animation-duration: 17s; }
    .sparkle { animation: sparkle 3.6s ease-in-out infinite; }
    .sparkle-b { animation-delay: -1.4s; }
    .sparkle-c { animation-delay: -2.3s; }
    .boat { animation: boatBob 5.2s ease-in-out infinite; }
    .cloud-group-a { animation: cloudBob 13s ease-in-out infinite; }

    .road-dash { stroke-dasharray: 46 62; animation: roadDrift 1.15s linear infinite; }
    .chain-dash { stroke-dasharray: 5 7; animation: chainDrift 1.1s linear infinite; }
    .speed-line { stroke-dasharray: 26 94; animation: speedFlash 2.8s linear infinite; }
    .speed-line-b { animation-delay: -.9s; animation-duration: 3.4s; }
    .speed-line-c { animation-delay: -1.9s; animation-duration: 2.3s; }
    .puff { transform-box: fill-box; transform-origin: center; animation: puff 2.6s ease-out infinite; }
    .puff-b { animation-delay: -.8s; animation-duration: 3.1s; }
    .puff-c { animation-delay: -1.7s; animation-duration: 2.9s; }
    .grass-sway { transform-box: fill-box; transform-origin: center bottom; animation: grassSway 4.8s ease-in-out infinite alternate; }
    .grass-sway-b { animation-duration: 5.7s; animation-delay: -2.2s; }

    .rider-upper { animation: riderBob 3.1s ease-in-out infinite; }
    .wing-ride { transform-box: view-box; transform-origin: 556px 291px; animation: wingRide 3.1s ease-in-out infinite; }
    .scarf-one, .scarf-two, .scarf-fringe {
      transform-box: view-box;
      transform-origin: 638px 282px;
      animation: scarfWave 2.1s ease-in-out infinite alternate;
    }
    .scarf-two { animation-duration: 2.55s; animation-delay: -.7s; }
    .scarf-fringe { animation-duration: 1.8s; animation-delay: -.4s; }
    .pouch-soft { transform-box: view-box; transform-origin: 758px 247px; animation: pouchWobble 2.7s ease-in-out infinite; }
    .helmet-plume { transform-box: view-box; transform-origin: 690px 144px; animation: plumeBob 1.9s ease-in-out infinite alternate; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 6.4s infinite; }
    .chest-feather { animation: chestBreathe 3.1s ease-in-out infinite; }
    .footer-bob { animation: copyRise 1.2s .2s cubic-bezier(.2, .8, .2, 1) both; }

    .is-paused .cloud-a,
    .is-paused .cloud-b,
    .is-paused .cloud-c,
    .is-paused .sun-rays,
    .is-paused .sun-glow,
    .is-paused .gull-a,
    .is-paused .gull-b,
    .is-paused .gull-wing,
    .is-paused .sea-line,
    .is-paused .sparkle,
    .is-paused .boat,
    .is-paused .cloud-group-a,
    .is-paused .road-dash,
    .is-paused .chain-dash,
    .is-paused .speed-line,
    .is-paused .puff,
    .is-paused .grass-sway,
    .is-paused .rider-upper,
    .is-paused .wing-ride,
    .is-paused .scarf-one,
    .is-paused .scarf-two,
    .is-paused .scarf-fringe,
    .is-paused .pouch-soft,
    .is-paused .helmet-plume,
    .is-paused .eye,
    .is-paused .chest-feather {
      animation-play-state: paused;
    }

    @keyframes copyRise {
      from { transform: translateY(14px); }
      to { transform: translateY(0); }
    }

    @keyframes cloudDriftA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-38px, 5px); }
    }

    @keyframes cloudDriftB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(28px, -4px); }
    }

    @keyframes cloudBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }

    @keyframes sunSpin { to { transform: rotate(360deg); } }

    @keyframes sunBreathe {
      0%, 100% { opacity: .72; transform: scale(1); }
      50% { opacity: .93; transform: scale(1.035); }
    }

    @keyframes gullFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes gullWing {
      from { transform: scaleY(1); }
      to { transform: scaleY(.58); }
    }

    @keyframes seaDrift { to { stroke-dashoffset: -345; } }

    @keyframes sparkle {
      0%, 100% { opacity: .18; }
      45% { opacity: .8; }
    }

    @keyframes boatBob {
      0%, 100% { transform: translateY(0) rotate(-.4deg); }
      50% { transform: translateY(4px) rotate(.6deg); }
    }

    @keyframes roadDrift { to { stroke-dashoffset: -108; } }

    @keyframes chainDrift { to { stroke-dashoffset: 36; } }

    @keyframes speedFlash {
      0% { stroke-dashoffset: 110; opacity: 0; }
      18% { opacity: .62; }
      70% { opacity: .32; }
      100% { stroke-dashoffset: -260; opacity: 0; }
    }

    @keyframes puff {
      0% { opacity: 0; transform: translate(8px, 4px) scale(.35); }
      20% { opacity: .36; }
      100% { opacity: 0; transform: translate(-72px, -29px) scale(1.55); }
    }

    @keyframes grassSway {
      from { transform: rotate(-1.5deg); }
      to { transform: rotate(2.2deg); }
    }

    @keyframes riderBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2.5px); }
    }

    @keyframes wingRide {
      0%, 100% { transform: rotate(0); }
      50% { transform: rotate(-.8deg); }
    }

    @keyframes scarfWave {
      0% { transform: rotate(-1.4deg) translateY(0); }
      100% { transform: rotate(2.1deg) translateY(-2px); }
    }

    @keyframes pouchWobble {
      0%, 100% { transform: rotate(0) translateY(0); }
      50% { transform: rotate(.75deg) translateY(1.3px); }
    }

    @keyframes plumeBob {
      from { transform: rotate(-4deg); }
      to { transform: rotate(5deg); }
    }

    @keyframes blink {
      0%, 43%, 47%, 100% { transform: scaleY(1); }
      45% { transform: scaleY(.1); }
    }

    @keyframes chestBreathe {
      0%, 100% { opacity: .36; }
      50% { opacity: .58; }
    }

    @container (max-width: 540px) {
      .copy { width: 42cqw; }
      h1 { font-size: clamp(21px, 7cqw, 36px); }
      .copy-zh { font-size: 8px; letter-spacing: .02em; }
      .eyebrow { gap: .55em; margin-bottom: 10px; font-size: 6.5px; letter-spacing: .12em; }
      .eyebrow::before { width: 12px; }
      .motion-toggle { padding-right: 6px; }
      .toggle-copy { display: none; }
      .meta-right { display: none; }
      .meta { font-size: 6px; letter-spacing: .1em; }
    }

    @media (max-height: 520px) {
      .copy-zh { display: none; }
      .meta-right { display: none; }
    }

    @media (max-width: 760px) and (orientation: portrait) {
      body { padding: 2svh 2vw; }
      .poster {
        width: min(96vw, 76.8svh);
        aspect-ratio: 6 / 7;
        border-radius: 18px;
      }
      .sun-position { transform: translateX(-215px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .copy,
      .footer-bob { animation: none; }
    }
  </style>
</head>
<body>
  <main class="poster" id="poster">
    <svg class="art" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="art-title art-desc">
      <title id="art-title">海岸慢骑</title>
      <desc id="art-desc">一只戴着青绿色头盔、围着珊瑚色围巾的鹈鹕，在海边木栈道上骑一辆青绿色自行车。车轮、脚踏、双腿与风景持续运动。</desc>

      <defs>
        <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#a7d2d5"/>
          <stop offset=".48" stop-color="#d6e2d2"/>
          <stop offset=".78" stop-color="#f2dfbe"/>
          <stop offset="1" stop-color="#f6d6a9"/>
        </linearGradient>

        <radialGradient id="sunHalo">
          <stop offset="0" stop-color="#fff0bd" stop-opacity=".9"/>
          <stop offset=".3" stop-color="#f7d58f" stop-opacity=".38"/>
          <stop offset="1" stop-color="#f5cb82" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="seaGradient" x1="0" y1="484" x2="0" y2="638" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#81afa7"/>
          <stop offset=".5" stop-color="#669b97"/>
          <stop offset="1" stop-color="#4f8988"/>
        </linearGradient>

        <linearGradient id="shoreGradient" x1="0" y1="606" x2="0" y2="646" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ead4a7"/>
          <stop offset="1" stop-color="#d9b77f"/>
        </linearGradient>

        <linearGradient id="deckGradient" x1="0" y1="628" x2="0" y2="780" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#d9b886"/>
          <stop offset=".52" stop-color="#cba56f"/>
          <stop offset="1" stop-color="#bc8f59"/>
        </linearGradient>

        <pattern id="planks" width="130" height="28" patternUnits="userSpaceOnUse">
          <rect width="130" height="28" fill="#cda66f"/>
          <path d="M0 27.4H130" stroke="#a97e4e" stroke-width="2" opacity=".34"/>
          <path d="M38 1V27M101 1V27" stroke="#a97e4e" stroke-width="1.2" opacity=".2"/>
          <path d="M8 8C29 5 45 7 57 11" stroke="#e4c795" stroke-width="1.2" fill="none" opacity=".25"/>
        </pattern>

        <linearGradient id="bodyGradient" x1="455" y1="270" x2="626" y2="414" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#fffdf4"/>
          <stop offset=".6" stop-color="#f7efd9"/>
          <stop offset="1" stop-color="#e9dcc2"/>
        </linearGradient>

        <linearGradient id="wingGradient" x1="553" y1="279" x2="694" y2="368" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f6edda"/>
          <stop offset="1" stop-color="#dfd0b4"/>
        </linearGradient>

        <linearGradient id="beakGradient" x1="732" y1="207" x2="890" y2="236" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f8bc50"/>
          <stop offset=".55" stop-color="#efaa40"/>
          <stop offset="1" stop-color="#e99535"/>
        </linearGradient>

        <linearGradient id="pouchGradient" x1="748" y1="247" x2="829" y2="316" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f8cc77"/>
          <stop offset=".65" stop-color="#f1b450"/>
          <stop offset="1" stop-color="#e69a3a"/>
        </linearGradient>

        <linearGradient id="helmetGradient" x1="671" y1="143" x2="740" y2="188" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#2f7b72"/>
          <stop offset="1" stop-color="#185c59"/>
        </linearGradient>

        <radialGradient id="blush">
          <stop offset="0" stop-color="#e87d67" stop-opacity=".55"/>
          <stop offset="1" stop-color="#e87d67" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="saddleGradient" x1="460" y1="386" x2="506" y2="408" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#b87550"/>
          <stop offset="1" stop-color="#8e5138"/>
        </linearGradient>

        <filter id="softShadow" x="-50%" y="-300%" width="200%" height="700%">
          <feGaussianBlur stdDeviation="9"/>
        </filter>

        <filter id="smallBlur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.3"/>
        </filter>

        <symbol id="cloudShape" viewBox="0 0 160 50" overflow="visible">
          <path d="M5 39C0 26 8 14 24 14C28 2 47-5 61 5C72-8 94-8 103 7C118-1 142 5 146 21C158 24 162 37 153 44C120 51 34 50 5 39Z" fill="#fff9ea"/>
          <path d="M17 38C47 43 105 43 145 37" fill="none" stroke="#f2e4c9" stroke-width="2" stroke-linecap="round" opacity=".55"/>
        </symbol>

        <symbol id="gullShape" viewBox="-24 -12 48 20">
          <path class="gull-wing" d="M-21 2C-14-8-5-10 0-1C8-10 16-6 22 3" fill="none" stroke="#315452" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
      </defs>

      <!-- Sky and light -->
      <rect width="1200" height="780" fill="url(#skyGradient)"/>
      <circle class="sun-glow" cx="980" cy="151" r="176" fill="url(#sunHalo)"/>
      <g transform="translate(980 151)">
        <g class="sun-position">
          <circle class="sun-rays" r="102" fill="none" stroke="#e4b878" stroke-width="2" stroke-dasharray="2 15" opacity=".32"/>
          <circle r="53" fill="#f8cc7f"/>
          <circle r="44" fill="#fbd88f"/>
          <circle cx="-12" cy="-14" r="21" fill="#ffe7ac" opacity=".52"/>
        </g>
      </g>

      <g class="cloud-a" opacity=".82">
        <use href="#cloudShape" transform="translate(75 139) scale(.83)"/>
      </g>
      <g class="cloud-b" opacity=".65">
        <use href="#cloudShape" transform="translate(750 211) scale(.69)"/>
      </g>
      <g class="cloud-c" opacity=".5">
        <use href="#cloudShape" transform="translate(338 67) scale(.46)"/>
      </g>
      <g class="cloud-b" opacity=".5">
        <use href="#cloudShape" transform="translate(965 297) scale(.38)"/>
      </g>

      <g transform="translate(824 278)" opacity=".7">
        <g class="gull-a">
          <use href="#gullShape" width="48" height="20" x="-24" y="-12"/>
        </g>
      </g>
      <g transform="translate(887 328) scale(.72)" opacity=".6">
        <g class="gull-b">
          <use href="#gullShape" width="48" height="20" x="-24" y="-12"/>
        </g>
      </g>
      <g transform="translate(1050 254) scale(.55)" opacity=".52">
        <g class="gull-a">
          <use href="#gullShape" width="48" height="20" x="-24" y="-12"/>
        </g>
      </g>

      <!-- Far coast and sea -->
      <path d="M0 492V454C48 438 83 449 124 457C169 466 209 442 257 455C294 465 320 478 360 492Z" fill="#89a99a" opacity=".72"/>
      <path d="M0 479C49 468 89 477 124 485C169 496 212 474 260 481C295 486 327 490 360 494L360 505H0Z" fill="#709586" opacity=".5"/>

      <g transform="translate(195 447)">

    <header class="copy">
      <p class="eyebrow">Seaside postcard · No. 05</p>
      <h1>A slow ride<br><em>into the sun.</em></h1>
      <p class="copy-zh">沿海公路上，一只鹈鹕，<br>和没有目的地的下午。</p>
    </header>

    <button class="motion-toggle" id="motion-toggle" type="button" aria-label="暂停动画">
      <span class="toggle-icon" aria-hidden="true">
        <svg viewBox="0 0 12 12" fill="currentColor">
          <g class="pause-glyph"><rect x="2.2" y="1.6" width="2.6" height="8.8" rx="1"/><rect x="7.2" y="1.6" width="2.6" height="8.8" rx="1"/></g>
          <g class="play-glyph"><path d="M3.1 1.5C3.1 .9 3.8 .6 4.3 1L9.8 5.4C10.3 5.8 10.3 6.4 9.8 6.8L4.3 11C3.8 11.4 3.1 11.1 3.1 10.5Z"/></g>

      <span>12 km loop</span>

  <script>
    (() => {
      const elements = {
        spokesRear: document.getElementById('spokes-rear'),
        spokesFront: document.getElementById('spokes-front'),
        chainring: document.getElementById('chainring'),
        crankNear: document.getElementById('crank-near'),
        crankHighlight: document.getElementById('crank-highlight'),
        crankFar: document.getElementById('crank-far'),
        pedalNear: document.getElementById('pedal-near'),
        pedalFar: document.getElementById('pedal-far'),
        footNear: document.getElementById('foot-near'),
        footFar: document.getElementById('foot-far'),
        legNear: document.getElementById('leg-near'),
        legNearBase: document.getElementById('leg-near-base'),
        legNearShine: document.getElementById('leg-near-shine'),
        legFar: document.getElementById('leg-far'),
        legFarBase: document.getElementById('leg-far-base'),
        kneeNear: document.getElementById('knee-near'),
        kneeFar: document.getElementById('knee-far'),
        toggle: document.getElementById('motion-toggle'),
        toggleCopy: document.getElementById('toggle-copy')
      };

      const bottomBracket = { x: 565, y: 552 };
      const crankRadius = 44;
      const hipNear = { x: 540, y: 402 };
      const hipFar = { x: 523, y: 396 };
      const thigh = 116;
      const shin = 130;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reducedMotion.matches;
      let elapsed = 0;
      let previous = performance.now();

      function toDegrees(radians) {
        return radians * 180 / Math.PI;
      }

      function pedalPosition(angle) {
        return {
          x: bottomBracket.x + Math.cos(angle) * crankRadius,
          y: bottomBracket.y + Math.sin(angle) * crankRadius
        };
      }

      function solveLeg(hip, ankle) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.max(1, Math.min(thigh + shin - .001, Math.hypot(dx, dy)));
        const ux = dx / distance;
        const uy = dy / distance;
        const along = (thigh * thigh - shin * shin + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        return {
          x: hip.x + ux * along + uy * bend,
          y: hip.y + uy * along - ux * bend
        };
      }

      function setLine(line, start, end) {
        line.setAttribute('x1', start.x.toFixed(2));
        line.setAttribute('y1', start.y.toFixed(2));
        line.setAttribute('x2', end.x.toFixed(2));
        line.setAttribute('y2', end.y.toFixed(2));
      }

      function setLeg(paths, knee, foot, hip, target) {
        const ankle = { x: target.x, y: target.y - 8 };
        const joint = solveLeg(hip, ankle);
        const d = `M${hip.x} ${hip.y}L${joint.x.toFixed(2)} ${joint.y.toFixed(2)}L${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}`;
        paths.forEach((path) => path.setAttribute('d', d));
        knee.setAttribute('cx', joint.x.toFixed(2));
        knee.setAttribute('cy', joint.y.toFixed(2));
        foot.setAttribute('transform', `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)})`);
        return joint;
      }

      function render() {
        const wheelAngle = elapsed * 145;
        const crankAngle = elapsed * 1.8 - .75;

        elements.spokesRear.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)})`);
        elements.spokesFront.setAttribute('transform', `rotate(${(wheelAngle + 9).toFixed(2)})`);
        elements.chainring.setAttribute('transform', `rotate(${toDegrees(crankAngle).toFixed(2)})`);

        const near = pedalPosition(crankAngle);
        const far = pedalPosition(crankAngle + Math.PI);

        elements.pedalNear.setAttribute('transform', `translate(${near.x.toFixed(2)} ${near.y.toFixed(2)})`);
        elements.pedalFar.setAttribute('transform', `translate(${far.x.toFixed(2)} ${far.y.toFixed(2)})`);

        setLine(elements.crankNear, bottomBracket, near);
        setLine(elements.crankHighlight, bottomBracket, near);
        setLine(elements.crankFar, bottomBracket, far);

        setLeg([elements.legNear, elements.legNearBase], elements.kneeNear, elements.footNear, hipNear, near);
        setLeg([elements.legFar, elements.legFarBase], elements.kneeFar, elements.footFar, hipFar, far);

        const shine = { x: hipNear.x + 4, y: hipNear.y + 3 };
        const kneeX = Number(elements.kneeNear.getAttribute('cx'));
        const kneeY = Number(elements.kneeNear.getAttribute('cy'));
        elements.legNearShine.setAttribute('d', `M${shine.x} ${shine.y}L${(shine.x + (kneeX - shine.x) * .88).toFixed(2)} ${(shine.y + (kneeY - shine.y) * .88).toFixed(2)}`);
      }

      function updateButton() {
        document.body.classList.toggle('is-paused', paused);
        elements.toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        elements.toggleCopy.textContent = paused ? 'Play' : 'Pause';
      }

      function animate(now) {
        if (!paused) {
          const delta = Math.min((now - previous) / 1000, .08);
          elapsed += delta;
          render();
          previous = now;
        }
        requestAnimationFrame(animate);
      }

      elements.toggle.addEventListener('click', () => {
        paused = !paused;
        previous = performance.now();
        updateButton();
      });

      reducedMotion.addEventListener('change', (event) => {
        if (event.matches) {
          paused = true;
          updateButton();
        }
      });

      updateButton();
      render();
      requestAnimationFrame(animate);
    })();
  </script>
