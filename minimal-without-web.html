<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ddc1">
  <title>鹈鹕去兜风 · A Pelican on a Bicycle</title>
  <style>
    :root {
      --ink: #264542;
      --ink-soft: rgba(38, 69, 66, .62);
      --cream: #fff8e9;
      --coral: #e9694d;
      --sky-top: #f7e3cc;
      --sky-mid: #f5d8c9;
      --sky-low: #cde9dd;
      --sand: #efd3aa;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 48%, var(--sky-low) 63%, var(--sand));
      color: var(--ink);
      font-family: "Avenir Next", "Gill Sans", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
    }

    .art {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 55% 46%, transparent 42%, rgba(43, 70, 64, .08) 100%),
        linear-gradient(180deg, rgba(255, 250, 240, .08), transparent 18%);
      mix-blend-mode: multiply;
    }

    .postcard {
      position: absolute;
      z-index: 3;
      top: clamp(28px, 6.2vh, 70px);
      left: clamp(24px, 6vw, 84px);
      width: min(390px, 36vw);
      pointer-events: none;
      user-select: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      color: var(--ink-soft);
      font-size: clamp(8px, .72vw, 10px);
      font-weight: 650;
      letter-spacing: .25em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: clamp(26px, 3.4vw, 44px);
      height: 1px;
      flex: 0 0 auto;
      background: currentColor;
    }

    .eyebrow .no {
      margin-left: auto;
      opacity: .72;
      letter-spacing: .16em;
    }

    h1 {
      margin: clamp(16px, 2.2vh, 28px) 0 18px;
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-size: clamp(52px, 6vw, 92px);
      font-weight: 500;
      line-height: .82;
      letter-spacing: -.045em;
    }

    h1 em {
      display: inline-block;
      margin-left: .66em;
      color: #d75f43;
      font-weight: 400;
      letter-spacing: -.05em;
    }

    .subtitle {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0;
      color: var(--ink-soft);
      font-size: clamp(10px, .8vw, 12px);
      letter-spacing: .08em;
      line-height: 1.7;
    }

    .subtitle::before {
      content: "·";
      color: var(--coral);
      font-size: 20px;
      line-height: 0;
    }

    .coords {
      position: absolute;
      z-index: 3;
      right: clamp(22px, 4vw, 58px);
      bottom: clamp(20px, 4vh, 42px);
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(47, 70, 61, .52);
      font-size: clamp(7px, .62vw, 9px);
      font-weight: 650;
      letter-spacing: .2em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    .coords::before {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
    }

    /* ---- ambient animation ------------------------------------------------ */

    .cloud-a { animation: cloudFloatA 17s ease-in-out infinite; }
    .cloud-b { animation: cloudFloatB 23s ease-in-out infinite; }
    .cloud-c { animation: cloudFloatA 29s ease-in-out infinite reverse; }

    @keyframes cloudFloatA {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(26px, 5px); }
    }

    @keyframes cloudFloatB {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-34px, 7px); }
    }

    .wave {
      stroke-dasharray: 24 34;
      animation: waveFlow 6.5s linear infinite;
    }

    .wave.slow { animation-duration: 10s; animation-direction: reverse; }

    @keyframes waveFlow {
      to { stroke-dashoffset: -116; }
    }

    .shimmer {
      animation: shimmer 4.6s ease-in-out infinite;
    }

    .shimmer:nth-of-type(2) { animation-delay: -1.7s; }
    .shimmer:nth-of-type(3) { animation-delay: -3.1s; }

    @keyframes shimmer {
      0%, 100% { opacity: .28; transform: translateX(0); }
      50% { opacity: .72; transform: translateX(-10px); }
    }

    .boat-bob { animation: boatBob 4.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes boatBob {
      0%, 100% { transform: translateY(0) rotate(-1.1deg); }
      50% { transform: translateY(-4px) rotate(1.2deg); }
    }

    .eye { animation: blink 6.4s ease-in-out infinite; transform-box: view-box; transform-origin: 711px 201px; }
    @keyframes blink {
      0%, 91%, 100% { transform: scaleY(1); }
      93.5% { transform: scaleY(.08); }
      95% { transform: scaleY(1); }
    }

    .tail-feathers {
      animation: tailSway 4.2s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 493px 329px;
    }
    @keyframes tailSway {
      0%, 100% { transform: rotate(-.7deg); }
      50% { transform: rotate(1.5deg); }
    }

    .scarf-a {
      animation: scarfA 2.7s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 651px 263px;
    }
    .scarf-b {
      animation: scarfB 3.3s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 646px 265px;
    }
    @keyframes scarfA {
      0%, 100% { transform: rotate(-2.2deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes scarfB {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-3.6deg); }
    }

    .fish-tail {
      animation: fishWiggle 1.9s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 831px 461px;
    }
    @keyframes fishWiggle {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(7deg); }
    }

    .road-line {
      stroke-dasharray: 54 164;
      animation: roadFlow 1.65s linear infinite;
    }
    .road-line.far { animation-duration: 2.25s; opacity: .28; }

    @keyframes roadFlow {
      to { stroke-dashoffset: -218; }
    }

    .breeze {
      animation: breeze 4.8s ease-out infinite;
      opacity: 0;
    }
    .breeze.b2 { animation-delay: -2.2s; animation-duration: 5.8s; }
    .breeze.b3 { animation-delay: -3.4s; animation-duration: 4.2s; }
    @keyframes breeze {
      0% { transform: translateX(34px); opacity: 0; }
      16% { opacity: .62; }
      65% { opacity: .22; }
      100% { transform: translateX(-105px); opacity: 0; }
    }

    .grass-sway {
      animation: grassSway 4.6s ease-in-out infinite;
      transform-box: view-box;
      transform-origin: 84px 798px;
    }
    @keyframes grassSway {
      0%, 100% { transform: rotate(-1deg); }
      50% { transform: rotate(1.6deg); }
    }

    @media (max-width: 760px) and (orientation: portrait) {
      body {
        overflow-y: auto;
        background:
          radial-gradient(circle at 76% 18%, rgba(255, 222, 165, .8), transparent 32%),
          linear-gradient(180deg, #f8e8d2 0%, #f2d7c8 46%, #d4eadd 100%);
      }

      .scene {
        position: relative;
        min-height: 100svh;
        padding: 0 0 28px;
      }

      .art {
        position: absolute;
        top: 53%;
        left: 50%;
        width: 108vw;
        height: auto;
        transform: translate(-50%, -50%) rotate(-1.2deg);
        border-radius: 22px;
        box-shadow: 0 30px 70px rgba(73, 90, 72, .18);
        overflow: hidden;
      }

      .postcard {
        top: 28px;
        left: 24px;
        width: calc(100vw - 48px);
      }

      h1 {
        margin-top: 18px;
        font-size: clamp(54px, 16vw, 78px);
      }

      .subtitle {
        max-width: 280px;
        font-size: 10px;
      }

      .coords {
        position: absolute;
        top: calc(100svh - 28px);
        bottom: auto;
        right: 24px;
        font-size: 8px;
        max-width: calc(100vw - 48px);
        white-space: nowrap;
      }

      .vignette {
        z-index: 2;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(54, 75, 62, .09) 100%);
      }
    }

    .mobile-caption { display: none; }

    @media (max-width: 760px) and (orientation: portrait) {
      .mobile-caption {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 104px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        z-index: 3;
        pointer-events: none;
        user-select: none;
      }

      .mobile-caption p {
        margin: 0;
        color: rgba(38, 69, 66, .56);
        font-family: "Songti SC", "Noto Serif CJK SC", "Iowan Old Style", Georgia, serif;
        font-size: 17px;
        letter-spacing: .12em;
        line-height: 1.65;
      }

      .mobile-caption span {
        display: grid;
        width: 46px;
        height: 46px;
        place-items: center;
        border: 1px solid rgba(38, 69, 66, .28);
        border-radius: 50%;
        color: rgba(38, 69, 66, .52);
        font-family: "Iowan Old Style", Georgia, serif;
        font-size: 17px;
        font-style: italic;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <svg class="art" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="artTitle artDesc">
      <title id="artTitle">一只鹈鹕骑着自行车沿着海边兜风</title>
      <desc id="artDesc">一张暖色调的海岸插画。一只戴珊瑚色围巾的鹈鹕骑着珊瑚色自行车，脚下踏板转动，车筐里露出一条小鱼，海浪、云朵和地面的速度线缓缓移动。</desc>

      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f7e2ca"/>
          <stop offset=".5" stop-color="#f5d7c8"/>
          <stop offset=".78" stop-color="#dfe9d7"/>
          <stop offset="1" stop-color="#c7e5da"/>
        </linearGradient>

        <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffe7ae" stop-opacity=".82"/>
          <stop offset=".44" stop-color="#ffdda1" stop-opacity=".33"/>
          <stop offset="1" stop-color="#ffdda1" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#91cec5"/>
          <stop offset=".55" stop-color="#79beb5"/>
          <stop offset="1" stop-color="#60aaa5"/>
        </linearGradient>

        <linearGradient id="sandGrad" x1=".12" y1="0" x2=".82" y2="1">
          <stop offset="0" stop-color="#f7e4c4"/>
          <stop offset=".52" stop-color="#f0d4ac"/>
          <stop offset="1" stop-color="#e4bd90"/>
        </linearGradient>

        <linearGradient id="bodyGrad" x1=".26" y1="0" x2=".75" y2="1">
          <stop offset="0" stop-color="#fffdf6"/>
          <stop offset=".52" stop-color="#fbf1df"/>
          <stop offset="1" stop-color="#e8d5b8"/>
        </linearGradient>

        <linearGradient id="wingGrad" x1=".15" y1=".05" x2=".8" y2="1">
          <stop offset="0" stop-color="#fffdf6"/>
          <stop offset=".58" stop-color="#f6ead6"/>
          <stop offset="1" stop-color="#e4d0b0"/>
        </linearGradient>

        <linearGradient id="beakGrad" x1="0" y1="0" x2=".85" y2="1">
          <stop offset="0" stop-color="#ffd98e"/>
          <stop offset=".48" stop-color="#f6bd62"/>
          <stop offset="1" stop-color="#e9a148"/>
        </linearGradient>

        <linearGradient id="pouchGrad" x1=".18" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#f8c573"/>
          <stop offset=".6" stop-color="#f0a85b"/>
          <stop offset="1" stop-color="#dd8742"/>
        </linearGradient>

        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2=".3">
          <stop offset="0" stop-color="#e96147"/>
          <stop offset="1" stop-color="#f47e58"/>
        </linearGradient>

        <filter id="softShadow" x="-40%" y="-80%" width="180%" height="260%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>

        <filter id="cloudBlur" x="-10%" y="-30%" width="120%" height="160%">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>

        <g id="cloudShape">
          <path d="M0 31 C3 16 20 9 35 16 C40 0 63 -4 76 9 C89 -3 113 5 114 24 C133 22 146 35 140 49 C134 62 22 63 7 55 C-3 51 -6 40 0 31Z"/>
        </g>

        <g id="wheelShape">
          <circle r="84" fill="none" stroke="#27464b" stroke-width="13"/>

          <circle r="75" fill="none" stroke="#f8ecd4" stroke-width="5"/>

            <line x1="0" y1="-67" x2="0" y2="67"/>

            <line x1="0" y1="-67" x2="0" y2="67" transform="rotate(60)"/>

            <line x1="0" y1="-67" x2="0" y2="67" transform="rotate(120)"/>
            <line x1="0" y1="-67" x2="0" y2="67" transform="rotate(150)"/>
          </g>
          <circle r="53" fill="none" stroke="#47666b" stroke-width="1.2" opacity=".32"/>
          <circle r="10" fill="#e7b65e" stroke="#29474b" stroke-width="4"/>
          <circle r="3" fill="#29474b"/>
          <circle cx="0" cy="-58" r="4.5" fill="#ed7758"/>
          <path d="M-4.5 -77 L4.5 -77 L0 -68Z" fill="#f8ecd4" opacity=".85"/>

      </defs>

        <!-- right headland -->

        <path d="M1055 500 C1091 483 1145 476 1200 480 L1200 511 C1139 504 1093 514 1055 526Z" fill="#5f948a" opacity=".42"/>

        <!-- sailboat -->
        <g transform="translate(855 500)">
          <g class="boat-bob">

        <!-- little ground details -->

          <circle cx="227" cy="663" r="2.1"/>

          <g class="grass-sway" transform="translate(43 767)">
            <path d="M0 31 C1 17 5 7 13 -2 M13 30 C15 15 21 5 28 -5 M26 33 C26 17 29 7 37 0"/>
          </g>
          <g opacity=".63">
            <path d="M1110 749 C1112 730 1119 717 1130 704 M1123 750 C1127 731 1135 719 1144 710 M1137 754 C1137 737 1142 726 1150 718"/>
          </g>
        </g>
        <g transform="translate(998 710)" fill="none" stroke="#b98758" stroke-width="2" stroke-linecap="round" opacity=".54">
          <path d="M0 0 C8 -8 19 -6 22 2 C15 10 5 10 0 0Z"/>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const svg = document.querySelector('.art');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      const wheelRear = $('rearWheelSpin');
      const wheelFront = $('frontWheelSpin');
      const crankFar = $('crankFar');
      const crankNear = $('crankNear');
      const pedalFar = $('pedalFar');
      const pedalNear = $('pedalNear');
      const chainring = $('chainring');
      const rider = $('riderTorso');
      const footFar = $('footFar');
      const footNear = $('footNear');

      const leg = {
        far: {
          hip: { x: 558, y: 443 },
          thigh: $('farThigh'), shin: $('farShin'),
          thighUnder: $('farThighUnder'), shinUnder: $('farShinUnder'),
          shinTexture: $('farShinTexture'), knee: $('farKnee')
        },
        near: {
          hip: { x: 578, y: 438 },
          thigh: $('nearThigh'), shin: $('nearShin'),
          thighUnder: $('nearThighUnder'), shinUnder: $('nearShinUnder'),
          shinTexture: $('nearShinTexture'), knee: $('nearKnee')
        }
      };

      // The crank and foot geometry.
      const bb = { x: 594, y: 598 };
      const crankRadius = 48;
      const thighLength = 96;
      const shinLength = 111;
      const ankleX = -5;
      const ankleY = -9;
      const deg = 180 / Math.PI;

      const pointPath = (a, b) =>
        `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} L ${b.x.toFixed(2)} ${b.y.toFixed(2)}`;

      function solveKnee(hip, ankle) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.min(
          Math.max(Math.hypot(dx, dy), Math.abs(thighLength - shinLength) + 1),
          thighLength + shinLength - 1
        );
        const ux = dx / (Math.hypot(dx, dy) || 1);
        const uy = dy / (Math.hypot(dx, dy) || 1);
        const along = (thighLength ** 2 - shinLength ** 2 + distance ** 2) / (2 * distance);
        const lift = Math.sqrt(Math.max(thighLength ** 2 - along ** 2, 0));
        const a = {
          x: hip.x + ux * along - uy * lift,
          y: hip.y + uy * along + ux * lift
        };
        const b = {
          x: hip.x + ux * along + uy * lift,
          y: hip.y + uy * along - ux * lift
        };
        // Pelican knees fold toward the sea, i.e. to the right of the frame.
        return a.x > b.x ? a : b;
      }

      function bendLeg(side, footAngle) {
        const target = {
          x: bb.x + crankRadius * Math.cos(footAngle) + ankleX,
          y: bb.y + crankRadius * Math.sin(footAngle) + ankleY
        };
        const knee = solveKnee(leg[side].hip, target);
        const data = leg[side];
        const thighD = pointPath(data.hip, knee);
        const shinD = pointPath(knee, target);
        data.thighUnder.setAttribute('d', thighD);
        data.shinUnder.setAttribute('d', shinD);
        data.thigh.setAttribute('d', thighD);
        data.shin.setAttribute('d', shinD);
        data.shinTexture.setAttribute('d', shinD);
        data.knee.setAttribute('cx', knee.x.toFixed(2));
        data.knee.setAttribute('cy', knee.y.toFixed(2));
        const foot = side === 'near' ? footNear : footFar;
        const tilt = -4 + Math.sin(footAngle) * 2.4;
        foot.setAttribute('transform', `translate(${target.x.toFixed(2)} ${target.y.toFixed(2)}) rotate(${tilt.toFixed(2)})`);
      }

      function render(time) {
        const wheelAngle = time * 172;
        const crankAngle = time * 75;
        const radians = crankAngle / deg;
        const farRadians = radians + Math.PI;

        wheelRear.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)})`);
        wheelFront.setAttribute('transform', `rotate(${wheelAngle.toFixed(2)})`);

        crankNear.setAttribute('transform', `rotate(${crankAngle.toFixed(2)} ${bb.x} ${bb.y})`);
        crankFar.setAttribute('transform', `rotate(${(crankAngle + 180).toFixed(2)} ${bb.x} ${bb.y})`);
        pedalNear.setAttribute('transform', `rotate(${(-crankAngle).toFixed(2)} ${bb.x + crankRadius} ${bb.y})`);
        pedalFar.setAttribute('transform', `rotate(${(-(crankAngle + 180)).toFixed(2)} ${bb.x + crankRadius} ${bb.y})`);
        chainring.setAttribute('transform', `rotate(${crankAngle.toFixed(2)} ${bb.x} ${bb.y})`);

        bendLeg('near', radians);
        bendLeg('far', farRadians);

        const bob = Math.sin(radians * 2 - 0.5) * 2.1;
        const lean = Math.sin(radians * 2 + 0.85) * 0.32;
        rider.setAttribute(
          'transform',
          `translate(0 ${bob.toFixed(2)}) rotate(${lean.toFixed(3)} 585 420)`
        );
      }

      let started = null;
      let last = 0;
      let frame = 0;

      function tick(now) {
        if (started === null) {
          started = now;
          last = now;
        }
        const elapsed = (now - started) / 1000;
        render(elapsed);
        frame = requestAnimationFrame(tick);
      }

      function start() {
        cancelAnimationFrame(frame);
        if (reduceMotion.matches) {
          render(0.55);
          return;
        }
        started = null;
        frame = requestAnimationFrame(tick);
      }

      start();

      if (typeof reduceMotion.addEventListener === 'function') {
        reduceMotion.addEventListener('change', start);
      }

      // If the SVG is in a tiny viewport, keep the illustration crisp.
      const resize = () => {
        if (!svg) return;
        svg.style.imageRendering = 'auto';
      };
      window.addEventListener('resize', resize, { passive: true });
    })();
