<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>鹈鹕快车 · Pelican Express</title>
  <style>
    :root {
      --ink: #173e3a;
      --ink-soft: rgba(23, 62, 58, .68);
      --paper: #fff7e7;
      --coral: #d85c48;
      --glass: rgba(255, 249, 235, .58);
      --glass-border: rgba(23, 62, 58, .18);
      --sans: "Avenir Next", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", "Noto Serif SC", Georgia, serif;
      --mono: "SFMono-Regular", "Cascadia Mono", "Roboto Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #b8dad0;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 440px;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 27%, rgba(251, 220, 156, .75), transparent 35%),
        linear-gradient(180deg, #82c7cd 0%, #b9dcd0 52%, #f3d8b1 100%);
      isolation: isolate;
    }

    .stage svg {
      display: block;
      width: 100%;
      height: 100%;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      box-shadow:
        inset 0 0 120px rgba(23, 62, 58, .09),
        inset 0 -70px 90px rgba(108, 67, 43, .06);
      background-image: radial-gradient(rgba(29, 54, 50, .13) .55px, transparent .55px);
      background-size: 4px 4px;
      opacity: .18;
      mix-blend-mode: multiply;
    }

    .masthead {
      position: absolute;
      z-index: 4;
      top: clamp(24px, 5.2vw, 70px);
      left: clamp(22px, 5.6vw, 82px);
      pointer-events: none;
      text-shadow: 0 1px 0 rgba(255, 249, 235, .2);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 13px;
      font-family: var(--mono);
      font-size: clamp(9px, .82vw, 11px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .eyebrow::before {
      content: "";
      display: block;
      width: 30px;
      height: 1px;
      background: currentColor;
      opacity: .65;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(34px, 4.5vw, 66px);
      font-weight: 600;
      line-height: .95;
      letter-spacing: .06em;
      color: var(--ink);
    }

    .subtitle {
      margin: 11px 0 0 2px;
      font-family: var(--serif);
      font-size: clamp(12px, 1.15vw, 17px);
      font-style: italic;
      letter-spacing: .12em;
      color: rgba(23, 62, 58, .62);
    }

    .motion-control {
      position: absolute;
      right: clamp(18px, 3.8vw, 52px);
      bottom: clamp(18px, 3.6vw, 46px);
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-width: 88px;
      padding: 11px 17px 10px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      background: var(--glass);
      box-shadow: 0 8px 30px rgba(43, 84, 75, .10);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(12px) saturate(1.15);
      -webkit-backdrop-filter: blur(12px) saturate(1.15);
      transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
    }

    .motion-control:hover {
      background: rgba(255, 250, 238, .8);
      border-color: rgba(23, 62, 58, .30);
    }

    .motion-control:active { transform: translateY(1px); }

    .motion-control:focus-visible {
      outline: 2px solid rgba(23, 62, 58, .72);
      outline-offset: 3px;
    }

    .control-icon {
      position: relative;
      width: 10px;
      height: 12px;
      flex: 0 0 10px;
    }

    .control-icon i {
      position: absolute;
      top: 1px;
      width: 3px;
      height: 10px;
      border-radius: 1px;
      background: currentColor;
      transition: transform .22s ease, opacity .18s ease;
    }

    .control-icon i:first-child { left: 1px; }
    .control-icon i:last-child { right: 1px; }

    .is-paused .control-icon i {
      top: 0;
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 9px solid currentColor;
      border-radius: 0;
      background: none;
    }

    .is-paused .control-icon i:first-child {
      left: 2px;
      right: auto;
    }

    .is-paused .control-icon i:last-child {
      opacity: 0;
      transform: translateX(-3px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 620px) {
      .masthead {
        top: 22px;
        left: 20px;
      }

      .eyebrow {
        margin-bottom: 10px;
        letter-spacing: .14em;
      }

      h1 {
        font-size: clamp(30px, 10vw, 42px);
      }

      .subtitle {
        margin-top: 8px;
        font-size: 11px;
      }

      .motion-control {
        right: 16px;
        bottom: 16px;
        min-width: 80px;
        padding: 10px 15px 9px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion-control,
      .control-icon i { transition: none; }
    }
  </style>
</head>
<body>

  <script>
    (() => {
      "use strict";

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const control = document.getElementById("motionControl");
      const controlLabel = document.getElementById("controlLabel");
      const stageElement = document.querySelector(".stage");
      const sceneElement = document.getElementById("pelican-scene");
      const scene = {
        rearWheel: document.getElementById("rearWheel"),
        frontWheel: document.getElementById("frontWheel"),
        farCrankArm: document.getElementById("farCrankArm"),
        farPedal: document.getElementById("farPedal"),
        nearCrankArm: document.getElementById("nearCrankArm"),
        nearCrankArmInner: document.getElementById("nearCrankArmInner"),
        nearPedal: document.getElementById("nearPedal"),
        farThighOutline: document.getElementById("farThighOutline"),
        farThigh: document.getElementById("farThigh"),
        farShinOutline: document.getElementById("farShinOutline"),
        farShin: document.getElementById("farShin"),
        farKnee: document.getElementById("farKnee"),
        farFoot: document.getElementById("farFoot"),
        nearThighOutline: document.getElementById("nearThighOutline"),
        nearThigh: document.getElementById("nearThigh"),
        nearThighShade: document.getElementById("nearThighShade"),
        nearShinOutline: document.getElementById("nearShinOutline"),
        nearShin: document.getElementById("nearShin"),
        nearKnee: document.getElementById("nearKnee"),
        nearFoot: document.getElementById("nearFoot"),
        pelicanUpper: document.getElementById("pelicanUpper"),
        chainring: document.getElementById("chainring"),
        eyeGroup: document.getElementById("eyeGroup"),
        scarfTailBackOutline: document.getElementById("scarfTailBackOutline"),
        scarfTailBack: document.getElementById("scarfTailBack"),
        scarfTailOutline: document.getElementById("scarfTailOutline"),
        scarfTail: document.getElementById("scarfTail"),
        scarfHighlight: document.getElementById("scarfHighlight"),
        streakTrack: document.getElementById("streakTrack"),
        laneDash: document.getElementById("laneDash"),
        sunRing: document.getElementById("sunRing"),
        seaWaves: document.querySelectorAll("#seaWaves path"),
        chainLines: document.querySelectorAll(".chainLine"),
        clouds: [...document.querySelectorAll(".cloud")].map((el) => ({
          el,
          x: Number(el.dataset.x),
          y: Number(el.dataset.y),
          scale: Number(el.dataset.scale),
          speed: Number(el.dataset.speed)
        }))
      };

      const BB = { x: 592, y: 540 };
      const CRANK_RADIUS = 47;
      const NEAR_HIP = { x: 551, y: 363 };
      const FAR_HIP = { x: 528, y: 365 };
      const THIGH_LENGTH = 112;
      const SHIN_LENGTH = 138;

      let running = !reduceMotion.matches;
      let time = 0.8;
      let lastFrame = 0;
      let frameRequest = 0;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const mod = (value, divisor) => ((value % divisor) + divisor) % divisor;

      function fitViewBox() {
        const aspect = window.innerWidth / window.innerHeight;
        const viewWidth = clamp(aspect * 700, 760, 1200);
        const viewHeight = viewWidth / aspect;
        const viewX = 600 - viewWidth / 2;
        const viewY = 700 - viewHeight;
        sceneElement.setAttribute("viewBox", [
          viewX.toFixed(2),
          viewY.toFixed(2),
          viewWidth.toFixed(2),
          viewHeight.toFixed(2)
        ].join(" "));
      }

      fitViewBox();
      window.addEventListener("resize", fitViewBox, { passive: true });
      window.addEventListener("orientationchange", fitViewBox, { passive: true });

      function solveKnee(hip, ankle, thighLength, shinLength) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.max(Math.hypot(dx, dy), 0.001);
        const ux = dx / distance;
        const uy = dy / distance;
        const reach = clamp(distance, Math.abs(thighLength - shinLength) + 0.01, thighLength + shinLength - 0.01);
        const along = (thighLength * thighLength - shinLength * shinLength + reach * reach) / (2 * reach);
        const height = Math.sqrt(Math.max(0, thighLength * thighLength - along * along));

        return {
          x: hip.x + ux * along + uy * height,
          y: hip.y + uy * along - ux * height
        };
      }

      function pathBetween(a, b) {
        return `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} L ${b.x.toFixed(2)} ${b.y.toFixed(2)}`;
      }

      function positionLeg(prefix, hip, pedal, phase) {
        const ankle = { x: pedal.x, y: pedal.y - 9 };
        const knee = solveKnee(hip, ankle, THIGH_LENGTH, SHIN_LENGTH);
        const thighPath = pathBetween(hip, knee);
        const shinPath = pathBetween(knee, ankle);
        const footTilt = -2 + Math.sin(phase) * 2.2;

        scene[prefix + "ThighOutline"].setAttribute("d", thighPath);
        scene[prefix + "Thigh"].setAttribute("d", thighPath);
        scene[prefix + "ShinOutline"].setAttribute("d", shinPath);
        scene[prefix + "Shin"].setAttribute("d", shinPath);
        scene[prefix + "Knee"].setAttribute("cx", knee.x.toFixed(2));
        scene[prefix + "Knee"].setAttribute("cy", knee.y.toFixed(2));
        scene[prefix + "Foot"].setAttribute(
          "transform",
          `translate(${ankle.x.toFixed(2)} ${ankle.y.toFixed(2)}) rotate(${footTilt.toFixed(2)})`
        );

        if (prefix === "near") {
          scene.nearThighShade.setAttribute("d", `M ${(hip.x + 4).toFixed(2)} ${(hip.y + 3).toFixed(2)} L ${(knee.x + 4).toFixed(2)} ${(knee.y + 3).toFixed(2)}`);
        }

        return knee;
      }

      function scarfPath(base, phaseOffset = 0, length = 1) {
        const waveA = Math.sin(time * 4.6 + phaseOffset) * 7;
        const waveB = Math.cos(time * 3.7 + phaseOffset) * 6;
        const waveC = Math.sin(time * 5.1 + phaseOffset + .8) * 5;
        const start = { x: 648, y: 249 + phaseOffset * 2 };
        const end = { x: start.x - 176 * length, y: 236 + waveC + phaseOffset * 5 };

        return [
          `M ${start.x} ${start.y}`,
          `C ${start.x - 33} ${228 + waveA + phaseOffset * 3}`,
          `${start.x - 63} ${273 + waveB + phaseOffset * 2}`,
          `${start.x - 96} ${248 + waveA * .7 + phaseOffset * 3}`,
          `C ${start.x - 128} ${226 + waveB * .7}`,
          `${end.x + 29} ${257 + waveC}`,
          `${end.x} ${end.y}`
        ].join(" ");
      }

      function setTransform(el, translationX = 0, translationY = 0, rotation = null) {
        let transform = `translate(${translationX.toFixed(2)} ${translationY.toFixed(2)})`;
        if (rotation !== null) transform += ` rotate(${rotation.toFixed(2)})`;
        el.setAttribute("transform", transform);
      }

      function updateScene(t) {
        const crankAngle = t * 2.55;
        const wheelAngle = t * 7.2;
        const bob = Math.sin(crankAngle * 2 + .35) * 1.7;
        const blinkCycle = t % 5.4;
        const blink = blinkCycle > 5.18 ? .12 : 1;

        setTransform(scene.rearWheel, 0, 0, wheelAngle * 57.2958);
        setTransform(scene.frontWheel, 0, 0, wheelAngle * 57.2958);
        setTransform(scene.chainring, 0, 0, crankAngle * 57.2958);

        const nearPedal = {
          x: BB.x + Math.cos(crankAngle) * CRANK_RADIUS,
          y: BB.y + Math.sin(crankAngle) * CRANK_RADIUS
        };
        const farPedal = {
          x: BB.x + Math.cos(crankAngle + Math.PI) * CRANK_RADIUS,
          y: BB.y + Math.sin(crankAngle + Math.PI) * CRANK_RADIUS
        };

        const nearArm = pathBetween(BB, nearPedal);
        const farArm = pathBetween(BB, farPedal);
        scene.nearCrankArm.setAttribute("d", nearArm);
        scene.nearCrankArmInner.setAttribute("d", nearArm);
        scene.farCrankArm.setAttribute("d", farArm);
        setTransform(scene.nearPedal, nearPedal.x, nearPedal.y, 0);
        setTransform(scene.farPedal, farPedal.x, farPedal.y, 0);

        const nearHip = { ...NEAR_HIP, y: NEAR_HIP.y + bob };
        const farHip = { ...FAR_HIP, y: FAR_HIP.y + bob };
        positionLeg("near", nearHip, nearPedal, crankAngle);
        positionLeg("far", farHip, farPedal, crankAngle + Math.PI);

        setTransform(scene.pelicanUpper, 0, bob);
        scene.eyeGroup.setAttribute(
          "transform",
          `translate(718.5 203) scale(1 ${blink.toFixed(3)}) translate(-718.5 -203)`
        );

        const scarfBack = scarfPath(1, .55, .82);
        scene.scarfTailBackOutline.setAttribute("d", scarfBack);
        scene.scarfTailBack.setAttribute("d", scarfBack);

        const scarfFront = scarfPath(0, 0, 1);
        scene.scarfTailOutline.setAttribute("d", scarfFront);
        scene.scarfTail.setAttribute("d", scarfFront);

        const wave = Math.sin(time * 4.6) * 7;
        scene.scarfHighlight.setAttribute(
          "d",
          `M 636 ${247 + wave * .18} C 610 ${237 + wave * .5} 590 ${254 + wave * .4} 568 ${248 + wave * .22}`
        );

        const seaShift = -mod(t * 11, 32);
        scene.seaWaves.forEach((path, index) => {
          path.setAttribute("stroke-dashoffset", (seaShift - index * 7).toFixed(2));
        });

        scene.streakTrack.setAttribute("transform", `translate(${(-mod(t * 170, 1200)).toFixed(2)} 0)`);
        scene.laneDash.setAttribute("stroke-dashoffset", (-mod(t * 105, 104)).toFixed(2));
        scene.chainLines.forEach((path) => {
          path.setAttribute("stroke-dashoffset", (-mod(t * 42, 7)).toFixed(2));
        });

        scene.sunRing.setAttribute("transform", `rotate(${(t * 1.25).toFixed(2)} 934 111)`);

        scene.clouds.forEach((cloud) => {
          const span = 1580;
          const x = mod(cloud.x - cloud.speed * t + 260, span) - 260;
          cloud.el.setAttribute("transform", `translate(${x.toFixed(2)} ${cloud.y}) scale(${cloud.scale})`);
        });
      }

      function scheduleFrame(now) {
        if (!running) return;
        if (!lastFrame) lastFrame = now;
        const delta = Math.min((now - lastFrame) / 1000, 0.05);
        lastFrame = now;
        time += delta;
        updateScene(time);
        frameRequest = requestAnimationFrame(scheduleFrame);
      }

      function start() {
        if (running) return;
        running = true;
        lastFrame = 0;
        frameRequest = requestAnimationFrame(scheduleFrame);
        document.body.classList.remove("is-paused");
        control.setAttribute("aria-pressed", "false");
        control.setAttribute("aria-label", "暂停动画");
        controlLabel.textContent = "暂停";
      }

      function pause() {
        if (!running) return;
        running = false;
        cancelAnimationFrame(frameRequest);
        document.body.classList.add("is-paused");
        control.setAttribute("aria-pressed", "true");
        control.setAttribute("aria-label", "播放动画");
        controlLabel.textContent = "播放";
      }

      control.addEventListener("click", () => {
        if (running) pause();
        else start();
      });

      reduceMotion.addEventListener("change", (event) => {
        if (event.matches) pause();
      });

      if (!running) {
        document.body.classList.add("is-paused");
        control.setAttribute("aria-pressed", "true");
        control.setAttribute("aria-label", "播放动画");
        controlLabel.textContent = "播放";
      }

      updateScene(time);
      if (running) {
        frameRequest = requestAnimationFrame(scheduleFrame);
      }
    })();
  </script>
</body>
</html>
